# Neuron HPC 접속 설정
ssh:
  login_host: neuron.ksc.re.kr
  dm_host: neuron-dm.ksc.re.kr
  user: "YOUR_ID"  
  port: 22
  control_persist: "4h"
  control_path: "~/.ssh/sockets/%r@%h-%p"
  server_alive_interval: 60
  server_alive_count_max: 10

# 원격 경로 설정
paths:
  scratch: "/scratch/{user}"
  projects: "/scratch/{user}/projects"
  data: "/scratch/{user}/data"
  logs: "/scratch/{user}/logs"
