# SLURM 기본 옵션
slurm:
  partition: amd_a100nv_8
  nodes: 1
  gpus: 2
  cpus_per_gpu: 8
  time: "24:00:00"
  comment: pytorch

# 동기화 제외 패턴
sync:
  exclude:
    - ".git/"
    - "__pycache__/"
    - "*.pyc"
    - "*.pyo"
    - ".DS_Store"
    - "wandb/"
    - "*.sif"
    - "*.pt"
    - "*.pth"
    - "outputs/"
    - "logs/"
    - ".vscode/"
    - ".idea/"
    - "*.egg-info/"
  pull_include:
    - "experiments/*/config.yaml"
    - "experiments/*/eval_results.json"
    - "experiments/*/train_log.json"
    - "experiments/*/checkpoints/best_model.pth"
    - "experiments/summary.csv"

# 환경 기본 모듈
# RCAC은 module load conda/pytorch_* 로 사전빌드 환경을 제공
# 사용자 conda 환경은 /apps/applications/Miniconda/25.11.1/bin/conda 사용
environment:
  conda_path: "/apps/applications/Miniconda/25.11.1/bin/conda"
  # SLURM 학습 시 기본 모듈 (conda/pytorch 모듈이 PyTorch+CUDA 환경 제공)
  default_modules:
    - conda/pytorch_2.9.1_cuda12
  # 사용 가능한 사전빌드 환경:
  #   conda/pytorch_2.9.1_cuda12  - PyTorch 2.9.1 + CUDA 12
  #   conda/pytorch_2.9.1_cuda13  - PyTorch 2.9.1 + CUDA 13
  #   conda/tensorflow_2.20.0     - TensorFlow 2.20.0
  #   cuda/12.4.1                 - CUDA only (no Python)
