# Genesis simulation -> training -> evaluation pipeline
# Usage: RCAC_ACCOUNT=<your account> rcac-exp launch examples/experiment_genesis.yaml --dry-run

project: manipulation_genesis
description: "Vision-based manipulation with Genesis simulator"

slurm:
  # -p selects the GPU TYPE. Documented Gilbreth partitions: a10, a30,
  # a100-40gb, a100-80gb, training. Run `slist` to see what your account may
  # use, and change this to match.
  partition: a100-80gb
  qos: normal
  nodes: 1
  gpus_per_node: 2
  cpus_per_gpu: 8
  mem: 96G
  time: "24:00:00"
  # -A is deliberately absent: set RCAC_ACCOUNT, or slurm.account in
  # configs/rcac.yaml.

environment:
  type: singularity
  name: genesis_env
  container: /scratch/gilbreth/$USER/.rcac-tools/genesis-sim.sif
  # `modules:` deliberately absent -- see examples/experiment_simple.yaml.

base_params:
  dataset: /scratch/gilbreth/$USER/data/manipulation_genesis
  epochs: 100
  batch_size: 64
  optimizer: adamw
  learning_rate: 3e-4
  seed: 42

sweep:
  method: grid
  parameters:
    learning_rate: [1e-4, 3e-4, 1e-3]
    model_arch: [resnet50, vit_base]
    hidden_dim: [256, 512]

pipeline:
  - name: generate_data
    script: genesis_datagen.py
    args: "--env manipulation --num_episodes 10000 --output /scratch/gilbreth/$USER/data/manipulation_genesis"

  - name: train
    script: train.py
    depends_on: generate_data
    args: "--config {config_path}"

  - name: evaluate_sim
    script: genesis_eval.py
    depends_on: train
    args: "--checkpoint checkpoints/best_model.pth --env manipulation"
