[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-cli"
version = "0.1.0"
description = "Workflow CLIs for KISTI Neuron and Purdue RCAC Gilbreth HPC clusters"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "watchdog>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
neuron-connect = "neuron_cli.connect:connect"
neuron-status = "neuron_cli.connect:status"
neuron-disconnect = "neuron_cli.connect:disconnect"
neuron-sync = "neuron_cli.sync:cli"
neuron-env = "neuron_cli.env:cli"
neuron-exp = "neuron_cli.experiment:cli"
neuron-results = "neuron_cli.results:cli"
neuron-container = "neuron_cli.container:cli"
neuron-partition = "neuron_cli.partition_selector:select_partition"
neuron-keepalive = "neuron_cli.keepalive:cli"
neuron-notify = "neuron_cli.notify:cli"
neuron-sim = "neuron_cli.simulator:cli"
gilbreth-connect = "gilbreth_cli.connect:connect"
gilbreth-status = "gilbreth_cli.connect:status"
gilbreth-disconnect = "gilbreth_cli.connect:disconnect"
gilbreth-sync = "gilbreth_cli.sync:cli"
gilbreth-env = "gilbreth_cli.env:cli"
gilbreth-exp = "gilbreth_cli.experiment:cli"
gilbreth-run = "gilbreth_cli.run:run"
gilbreth-shell = "gilbreth_cli.run:shell"
gilbreth-info = "gilbreth_cli.info:cli"

[tool.setuptools.packages.find]
include = ["neuron_cli*", "gilbreth_cli*"]
