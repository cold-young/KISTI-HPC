[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcac-cli"
version = "0.1.0"
description = "RCAC HPC workflow automation CLI"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "watchdog>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "build",
]

[project.scripts]
rcac-connect = "rcac_cli.connect:connect"
rcac-status = "rcac_cli.connect:status"
rcac-disconnect = "rcac_cli.connect:disconnect"
rcac-sync = "rcac_cli.sync:cli"
rcac-env = "rcac_cli.env:cli"
rcac-exp = "rcac_cli.experiment:cli"
rcac-results = "rcac_cli.results:cli"
rcac-container = "rcac_cli.container:cli"
rcac-partition = "rcac_cli.partition_selector:select_partition"
rcac-keepalive = "rcac_cli.keepalive:cli"
rcac-notify = "rcac_cli.notify:cli"
rcac-sim = "rcac_cli.simulator:cli"

[tool.setuptools.packages.find]
include = ["rcac_cli*"]

# B3/R2: the wheel shipped neither templates nor configs, so an installed
# rcac-cli could not render a script or find a config. Both directories now
# live inside the package and are declared here AND in MANIFEST.in.
[tool.setuptools.package-data]
rcac_cli = ["templates/*.j2", "configs/*.yaml"]

# AC-7.6.  The offline gate is `pytest -q --strict-markers`, so every marker the
# suite uses has to be declared here or the run fails on an unknown marker.
#
# `unverified_fixture` is a PROVENANCE LABEL, NEVER A SKIP CONDITION.  The tests
# carrying it run and must pass: they exercise the parsers in
# `rcac_cli/discovery.py` against doc-derived sample output, which proves the
# parser handles the documented shape and proves nothing whatever about the
# cluster.  Plan section 6.2 rows L5/L5b replace those fixtures with real
# captures from a login node; the marker is how you find every assertion that
# has to be re-read when they do.  Nothing in the suite calls `pytest.skip`.
[tool.pytest.ini_options]
markers = [
    "unverified_fixture: reads a doc-derived fixture under tests/fixtures/ that has never been captured from a live Gilbreth login node (plan R13, rows L5/L5b). Provenance label only -- the test runs and must pass.",
]
